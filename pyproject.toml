[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wheelchair-navigation-preferences"
version = "0.1.0"
description = "Discrete wheelchair-inspired navigation preference learning"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "torch>=2.5", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
